<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solar Monitoring API</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 860px; padding: 0 1rem; color: #111; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #ddd; }
    code { background: #f2f2f2; padding: 1px 5px; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>Solar Monitoring API</h1>
  <p>Back-End на Flask + MySQL. Стан сервера: <b id="health">...</b></p>
  <table>
    <thead><tr><th>Метод</th><th>URL</th></tr></thead>
    <tbody id="routes"></tbody>
  </table>
  <script>
    fetch("/api/health").then(r => r.json()).then(d => health.textContent = d.status)
      .catch(() => health.textContent = "немає зв'язку з БД");
    fetch("/api/routes").then(r => r.json()).then(list => {
      routes.innerHTML = list.map(r =>
        `<tr><td>${r.methods.join(", ")}</td><td><code>${r.url.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></td></tr>`).join("");
    });
  </script>
</body>
</html>
